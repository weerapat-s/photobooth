name: PhotoBoothPad
options:
  bundleIdPrefix: th.ienas
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  PhotoBoothPad:
    type: application
    platform: iOS
    sources:
      - path: PhotoBoothPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: th.ienas.photoboothpad
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: PhotoBoothPad/Info.plist
      properties:
        CFBundleDisplayName: Photo Booth
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: เชื่อมต่อเซิร์ฟเวอร์ Photo Booth เพื่อจัดภาพ อัปโหลด และส่งคิวปริ้น
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
