<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จอช่าง — Photo Booth</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0d0d12; color: #f2f2f5;
    font-family: "Sarabun", "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; color: #b9b9c6; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card { background: #17171f; border: 1px solid #26262f; border-radius: 14px; padding: 18px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #23232c; }
  .row:last-child { border: none; }
  .row b { color: #9a9aa8; font-weight: 500; }
  .pill { padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .pill.idle { background: #2b2b36; color: #b9b9c6; }
  .pill.shooting { background: #2d5a3d; color: #8ef0ae; }
  .pill.processing { background: #4a4020; color: #ffd166; }
  .pill.done { background: #2a3f66; color: #9dc4ff; }
  .pill.error { background: #5a2531; color: #ff8fa3; }
  button {
    font: inherit; font-weight: 600;
    padding: 11px 20px; border: none; border-radius: 10px;
    background: #ff4d6d; color: #fff; cursor: pointer;
  }
  button.ghost { background: #23232e; color: #e8e8ef; }
  button:disabled { opacity: .45; cursor: default; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  input, select {
    font: inherit; width: 100%;
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid #33333f; background: #101018; color: #f2f2f5;
  }
  label { display: block; font-size: 13px; color: #9a9aa8; margin: 12px 0 5px; }
  .slot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
  .photo-slot { border: 1px solid #30303b; border-radius: 12px; padding: 10px; background: #111119; }
  .photo-slot h3 { margin: 0 0 8px; font-size: 14px; color: #cfcfd8; }
  .slot-preview { width: 100%; aspect-ratio: 3 / 2; border-radius: 8px; background: #23232d; display: grid; place-items: center; overflow: hidden; color: #777785; }
  .slot-preview img { width: 100%; height: 100%; object-fit: cover; }
  .slot-actions { display: flex; gap: 6px; margin-top: 8px; }
  .slot-actions button { flex: 1; padding: 8px 6px; font-size: 12px; }
  button.danger { background: #59212d; color: #ffafbd; }
  .browser { max-height: 260px; overflow: auto; margin-top: 10px; border: 1px solid #2a2a35; border-radius: 10px; }
  .browser div { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #20202a; font-size: 14px; }
  .browser div:hover { background: #1e1e28; }
  .ok { color: #8ef0ae; } .bad { color: #ff8fa3; } .warn { color: #ffd166; }
  .msg { min-height: 20px; font-size: 13px; margin-top: 10px; white-space: pre-line; }
  code { color: #ffd166; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<h1>จอช่าง — <span id="event-name">Photo Booth</span></h1>

<div class="grid">

  <div class="card">
    <h2>สถานะ</h2>
    <div class="row"><b>เซสชัน</b><span class="pill idle" id="phase">-</span></div>
    <div class="row"><b>ช็อต</b><span id="count">-</span></div>
    <div class="row"><b>รหัสเซสชัน</b><span id="sid">-</span></div>
    <div class="row"><b>ข้อความ</b><span id="msg">-</span></div>
    <div class="slot-grid" id="slots"></div>
    <div class="btns">
      <button id="btn-start">เริ่มเซสชันใหม่</button>
      <button id="btn-capture">ถ่ายช่องถัดไป</button>
      <button id="btn-finish">ยืนยันรูปทั้งหมด + จบงาน</button>
      <button class="ghost" id="btn-discard">ทิ้งเซสชัน</button>
    </div>
    <div class="msg" id="action-msg"></div>
  </div>

  <div class="card">
    <h2>ระบบ</h2>
    <div class="row"><b>กล้อง</b><span id="cam-state">-</span></div>
    <div class="row"><b>เฝ้าโฟลเดอร์</b><span id="watch-state">-</span></div>
    <div class="row"><b>โฟลเดอร์</b><code id="watch-dir">-</code></div>
    <div class="row"><b>Nextcloud</b><span id="nc-state">-</span></div>
    <div class="row"><b>ลิงก์แยกต่อเซสชัน</b><span id="share-state">-</span></div>
    <div class="row"><b>ffmpeg</b><span id="ff-state">-</span></div>
    <div class="row"><b>ลิงก์ล่าสุด</b><code id="last-link">-</code></div>
    <div class="btns">
      <button id="btn-preflight">Production Preflight</button>
      <button class="ghost" id="btn-cal-strip">Calibration 2x6</button>
      <button class="ghost" id="btn-cal-grid">Calibration 4x6</button>
    </div>
    <div class="msg" id="preflight-msg"></div>
  </div>

  <div class="card">
    <h2>กู้คืนและดูแลข้อมูล</h2>
    <div id="unfinished"><div class="row"><span>กำลังตรวจงานค้าง...</span></div></div>
    <div class="btns">
      <button class="ghost" id="btn-clean-preview">ดูรายการหมดอายุ</button>
      <button class="ghost" id="btn-clean-now">ลบรายการหมดอายุ</button>
    </div>
    <div class="msg" id="cleanup-msg"></div>
  </div>

  <div class="card">
    <h2>ตั้งค่า</h2>
    <label>รูปแบบการใช้งานหน้าจอลูกค้า</label>
    <select id="in-kiosk-mode">
      <option value="operator">เจ้าหน้าที่ควบคุม — จอลูกค้าใช้ดูอย่างเดียว</option>
      <option value="self_service">บริการตัวเอง — ลูกค้ากดเริ่ม ตรวจรูป และถ่ายซ้ำเอง</option>
    </select>

    <label>แหล่งภาพ</label>
    <select id="in-source">
      <option value="digicam">digicam — เจ้าหน้าที่กดถ่ายผ่าน digiCamControl</option>
      <option value="folder">folder — เฝ้าโฟลเดอร์ Capture One (ช่างกดชัตเตอร์เอง)</option>
      <option value="mock">mock — ภาพปลอม ไว้เทสต์</option>
      <option value="web">web — เว็บ PWA ใช้กล้องของ iPad โดยตรง (ไม่ต้องติดตั้งแอป)</option>
      <option value="ipad">ipad — แอป Native iPad คุม EOS R ผ่าน USB และส่งภาพเข้าเซิร์ฟเวอร์</option>
    </select>

    <label>นับถอยหลังก่อนแต่ละช็อต (วินาที) — โหมด digicam/web</label>
    <input id="in-countdown" type="number" min="0" max="10">

    <label>กล้องสำหรับโหมด web</label>
    <select id="in-web-facing">
      <option value="user">กล้องหน้า — ลูกค้าเห็นตัวเอง</option>
      <option value="environment">กล้องหลัง — คุณภาพสูงกว่า</option>
    </select>

    <label>บันทึกภาพแบบกระจกในโหมด web</label>
    <select id="in-web-mirror">
      <option value="true">ใช่ — เหมือนภาพที่เห็นบนจอ</option>
      <option value="false">ไม่ — บันทึกตามทิศจริงของกล้อง</option>
    </select>

    <label>โฟลเดอร์ Capture ของ Capture One — เฉพาะโหมด folder</label>
    <input id="in-watch" placeholder="เช่น D:\งานรับน้อง\Capture">
    <div class="browser" id="browser"></div>

    <label>จำนวนช็อตต่อเซสชัน</label>
    <input id="in-shots" type="number" min="1" max="8">

    <label>การ์ดใช้ช็อตล่าสุดกี่ภาพ (วิดีโอยังใช้ครบทุกช็อต)</label>
    <input id="in-printshots" type="number" min="1" max="8">

    <label>ปิดเซสชันอัตโนมัติถ้าเงียบเกิน (วินาที)</label>
    <input id="in-idle" type="number" min="5" max="180">

    <label>ชื่องาน (โชว์บนสตริปและจอลูกค้า)</label>
    <input id="in-event">

    <label>เลย์เอาต์การ์ด</label>
    <select id="in-layout">
      <option value="strip2x6">strip2x6 — สตริปแนวตั้ง</option>
      <option value="grid4x6">grid4x6 — ตาราง 2x2 ธีมมืด</option>
    </select>

    <label>สีพื้นหลังธีมการ์ด</label>
    <input id="in-themecolor" type="color">

    <div class="btns"><button id="btn-save">บันทึก</button></div>
    <div class="msg" id="save-msg"></div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const PHASE_TEXT = { idle: 'ว่าง', shooting: 'กำลังถ่าย', processing: 'กำลังประมวลผล', done: 'เสร็จ รอลูกค้าสแกน', error: 'ผิดพลาด' };

async function api(path, options) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}

function applyState(s) {
  $('phase').textContent = PHASE_TEXT[s.phase] || s.phase;
  $('phase').className = 'pill ' + s.phase;
  $('count').textContent = s.session ? s.session.count + ' / ' + s.session.total : '-';
  $('sid').textContent = s.session ? s.session.id : '-';
  $('msg').textContent = s.message || '-';
  $('event-name').textContent = s.eventName || 'Photo Booth';
  renderSlots(s);
  if (s.session && s.session.shareUrl) $('last-link').textContent = s.session.shareUrl;
  $('btn-start').disabled = s.phase === 'shooting' || s.phase === 'processing' || s.capturing;
  const externalCapture = ['folder', 'web', 'ipad'].includes(s.captureSource);
  $('btn-capture').disabled = !(s.phase === 'shooting' && s.session && s.session.count < s.session.total) || s.capturing || externalCapture;
  $('btn-capture').textContent = s.captureSource === 'folder' ? 'กดชัตเตอร์ที่กล้อง' : externalCapture ? 'ถ่ายจาก iPad' : 'ถ่ายช่องถัดไป';
  $('btn-finish').disabled = !(s.phase === 'shooting' && s.session && s.session.count === s.session.total) || s.capturing;
  $('btn-discard').disabled = s.phase === 'processing' || s.phase === 'idle';
}

function renderSlots(s) {
  const box = $('slots');
  box.innerHTML = '';
  for (const slot of s.session?.slots || []) {
    const card = document.createElement('div');
    card.className = 'photo-slot';
    const title = document.createElement('h3');
    title.textContent = 'รูปที่ ' + slot.number;
    const preview = document.createElement('div');
    preview.className = 'slot-preview';
    if (slot.preview) {
      const img = document.createElement('img');
      img.src = slot.preview;
      img.alt = 'รูปที่ ' + slot.number;
      preview.appendChild(img);
    } else {
      preview.textContent = 'ยังไม่มีรูป';
    }
    const actions = document.createElement('div');
    actions.className = 'slot-actions';
    const captureButton = document.createElement('button');
    captureButton.textContent = slot.filled ? 'ถ่ายใหม่' : 'ถ่ายช่องนี้';
    captureButton.disabled = s.capturing || s.phase !== 'shooting' || s.captureSource === 'folder';
    captureButton.onclick = () => capturePhoto(slot.number, slot.filled);
    actions.appendChild(captureButton);
    if (slot.filled) {
      const removeButton = document.createElement('button');
      removeButton.className = 'danger';
      removeButton.textContent = 'ลบรูป';
      removeButton.disabled = s.capturing || s.phase !== 'shooting';
      removeButton.onclick = () => removePhoto(slot.number);
      actions.appendChild(removeButton);
    }
    card.append(title, preview, actions);
    box.appendChild(card);
  }
}

async function capturePhoto(slot = null, replacing = false) {
  if (replacing && !confirm('ถ่ายรูปช่องนี้ใหม่? รูปเดิมจะถูกเอาออกเมื่อรูปใหม่บันทึกสำเร็จ')) return;
  $('action-msg').textContent = 'กำลังถ่าย' + (slot ? 'รูปที่ ' + slot : 'ช่องถัดไป') + '...';
  try {
    await api('/api/capture', { method: 'POST', body: JSON.stringify({ slot }) });
    $('action-msg').innerHTML = '<span class="ok">ถ่ายเสร็จแล้ว กรุณาตรวจรูป</span>';
  } catch (err) {
    $('action-msg').innerHTML = '<span class="bad">' + err.message + '</span>';
  }
}

async function removePhoto(slot) {
  if (!confirm('ลบรูปที่ ' + slot + ' ออกจากเซสชัน? รูปอื่นจะอยู่ช่องเดิม')) return;
  $('action-msg').textContent = 'กำลังลบรูปที่ ' + slot + '...';
  try {
    await api('/api/photo/' + slot, { method: 'DELETE' });
    $('action-msg').innerHTML = '<span class="ok">ลบแล้ว กดถ่ายรูปที่ ' + slot + ' ใหม่ได้เลย</span>';
  } catch (err) {
    $('action-msg').innerHTML = '<span class="bad">' + err.message + '</span>';
  }
}

async function refreshHealth() {
  try {
    const h = await api('/api/health');
    $('cam-state').innerHTML = h.camera.ok
      ? '<span class="ok">' + (h.camera.cameras.length ? h.camera.cameras.join(', ') : h.camera.transport) + '</span>'
      : '<span class="bad">' + (h.camera.error || 'ไม่พบกล้อง') + '</span>';
    $('watch-state').innerHTML = h.watch.watching
      ? '<span class="ok">กำลังเฝ้า</span>'
      : '<span class="bad">' + (h.watch.error || 'ไม่ได้เฝ้า') + '</span>';
    $('watch-dir').textContent = h.watch.dir || '(ยังไม่ตั้ง)';
    $('nc-state').innerHTML = h.nextcloud.ok ? '<span class="ok">ต่อได้</span>' : '<span class="bad">ต่อไม่ได้</span>';
    $('share-state').innerHTML = h.perSessionShare
      ? '<span class="ok">พร้อม — ลูกค้าเห็นเฉพาะของตัวเอง</span>'
      : '<span class="bad">ยังไม่ได้ตั้ง NC_USER/NC_APP_PASSWORD — ห้ามใช้งานจริง ลูกค้าจะเห็นเซสชันคนอื่นได้</span>';
    $('ff-state').innerHTML = h.ffmpeg ? '<span class="ok">พร้อม</span>' : '<span class="bad">ไม่พบไฟล์</span>';
  } catch (err) {
    $('watch-state').innerHTML = '<span class="bad">' + err.message + '</span>';
  }
}

async function loadConfig() {
  const c = await api('/api/config');
  $('in-kiosk-mode').value = c.kioskMode || 'operator';
  $('in-source').value = c.captureSource;
  $('in-countdown').value = c.countdown;
  $('in-web-facing').value = c.webCameraFacing || 'user';
  $('in-web-mirror').value = String(c.webMirror ?? true);
  $('in-watch').value = c.watchDir || '';
  $('in-shots').value = c.shots;
  $('in-printshots').value = c.printShots;
  $('in-idle').value = c.sessionIdleSeconds;
  $('in-event').value = c.eventName;
  $('in-layout').value = c.printLayout;
  $('in-themecolor').value = c.printThemeColor;
  browse(c.watchDir || null);
}

async function runPreflight() {
  $('preflight-msg').textContent = 'กำลังตรวจกล้อง ดิสก์ และ Nextcloud...';
  try {
    const report = await api('/api/preflight?deep=true');
    const lines = report.checks.map((c) => (c.pass ? '✓ ' : '✗ ') + c.name + ': ' + (c.detail || c.error || ''));
    $('preflight-msg').textContent = report.status + '\n' + lines.join('\n');
    $('preflight-msg').className = 'msg ' + (report.status === 'READY' ? 'ok' : report.status === 'BLOCKED' ? 'bad' : 'warn');
  } catch (err) {
    $('preflight-msg').textContent = err.message;
    $('preflight-msg').className = 'msg bad';
  }
}

async function refreshUnfinished() {
  const data = await api('/api/unfinished').catch(() => ({ unfinished: [] }));
  const box = $('unfinished');
  box.innerHTML = '';
  if (!data.unfinished.length) {
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = 'ไม่มีเซสชันค้าง';
    box.appendChild(row);
    return;
  }
  for (const item of data.unfinished) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('span');
    label.textContent = item.id + ' (' + item.validPhotosCount + ' รูป, ' + item.phase + ')';
    const actions = document.createElement('span');
    const resume = document.createElement('button');
    resume.textContent = 'ทำต่อ';
    resume.onclick = () => recover(item.id, 'resume');
    const discardButton = document.createElement('button');
    discardButton.className = 'ghost';
    discardButton.textContent = 'ทิ้ง local';
    discardButton.onclick = () => recover(item.id, 'discard');
    actions.append(resume, discardButton);
    row.append(label, actions);
    box.appendChild(row);
  }
}

async function recover(id, action) {
  if (action === 'discard' && !confirm('ลบไฟล์ local ของเซสชันนี้?')) return;
  try {
    await api('/api/recover/' + encodeURIComponent(id), { method: 'POST', body: JSON.stringify({ action }) });
    $('action-msg').textContent = action === 'resume' ? 'เริ่มกู้คืนแล้ว' : 'ลบงาน local แล้ว';
  } catch (err) {
    $('action-msg').textContent = err.message;
  }
  refreshUnfinished();
}

async function cleanup(dryRun) {
  if (!dryRun && !confirm('ลบข้อมูลที่หมดอายุตามนโยบายจริง? การลบบน Nextcloud ย้อนกลับไม่ได้')) return;
  $('cleanup-msg').textContent = 'กำลังตรวจ...';
  try {
    const data = await api('/api/cleanup?dryRun=' + String(dryRun), { method: 'POST' });
    const r = data.result;
    $('cleanup-msg').textContent = [
      dryRun ? 'ตัวอย่างรายการที่จะลบ' : 'ลบเสร็จแล้ว',
      'local ' + r.deletedLocal.length,
      'cloud ' + r.deletedCloud.length,
      'shares ' + r.revokedShares.length,
      r.disk.freeGb === null ? '' : 'ดิสก์เหลือ ' + r.disk.freeGb.toFixed(1) + ' GB',
    ].filter(Boolean).join(' · ');
  } catch (err) {
    $('cleanup-msg').textContent = err.message;
  }
}

async function browse(dir) {
  const url = dir ? '/api/browse?dir=' + encodeURIComponent(dir) : '/api/browse';
  const data = await api(url).catch(() => null);
  if (!data) return;
  const box = $('browser');
  box.innerHTML = '';
  if (data.parent !== null && data.parent !== undefined) {
    const up = document.createElement('div');
    up.textContent = '.. ขึ้นบน';
    up.onclick = () => browse(data.parent);
    box.appendChild(up);
  } else if (data.current) {
    const up = document.createElement('div');
    up.textContent = '.. ไดรฟ์ทั้งหมด';
    up.onclick = () => browse(null);
    box.appendChild(up);
  }
  for (const d of data.dirs) {
    const row = document.createElement('div');
    row.textContent = d.name;
    row.onclick = () => { $('in-watch').value = d.path; browse(d.path); };
    box.appendChild(row);
  }
}

$('btn-save').onclick = async () => {
  $('save-msg').textContent = 'กำลังบันทึก...';
  try {
    await api('/api/settings', {
      method: 'POST',
      body: JSON.stringify({
        KIOSK_MODE: $('in-kiosk-mode').value,
        CAPTURE_SOURCE: $('in-source').value,
        COUNTDOWN: Number($('in-countdown').value),
        WEB_CAMERA_FACING: $('in-web-facing').value,
        WEB_MIRROR: $('in-web-mirror').value,
        WATCH_DIR: $('in-watch').value.trim(),
        SHOTS: Number($('in-shots').value),
        PRINT_SHOTS: Number($('in-printshots').value),
        SESSION_IDLE_SECONDS: Number($('in-idle').value),
        EVENT_NAME: $('in-event').value.trim(),
        PRINT_LAYOUT: $('in-layout').value,
        PRINT_THEME_COLOR: $('in-themecolor').value,
      }),
    });
    $('save-msg').innerHTML = '<span class="ok">บันทึกแล้ว</span>';
    refreshHealth();
  } catch (err) {
    $('save-msg').innerHTML = '<span class="bad">' + err.message + '</span>';
  }
};

function bindAction(id, path, label) {
  $(id).onclick = async () => {
    $('action-msg').textContent = 'กำลังทำงาน...';
    try {
      await api(path, { method: 'POST' });
      $('action-msg').innerHTML = '<span class="ok">' + label + '</span>';
    } catch (err) {
      $('action-msg').innerHTML = '<span class="bad">' + err.message + '</span>';
    }
  };
}
bindAction('btn-start', '/api/start', 'เริ่มเซสชันแล้ว — กดถ่ายทีละช่อง');
bindAction('btn-discard', '/api/discard', 'ทิ้งเซสชันแล้ว');
$('btn-capture').onclick = () => capturePhoto();
$('btn-finish').onclick = async () => {
  if (!confirm('ยืนยันใช้รูปทุกช่องและจบงาน? หลังจากนี้จะเริ่มจัดภาพและอัปโหลด')) return;
  $('action-msg').textContent = 'กำลังจัดภาพและอัปโหลด...';
  try {
    await api('/api/finish', { method: 'POST' });
    $('action-msg').innerHTML = '<span class="ok">จบงานแล้ว</span>';
  } catch (err) {
    $('action-msg').innerHTML = '<span class="bad">' + err.message + '</span>';
  }
};
$('btn-preflight').onclick = runPreflight;
$('btn-cal-strip').onclick = () => window.open('/api/calibration?layout=strip2x6', '_blank');
$('btn-cal-grid').onclick = () => window.open('/api/calibration?layout=grid4x6', '_blank');
$('btn-clean-preview').onclick = () => cleanup(true);
$('btn-clean-now').onclick = () => cleanup(false);

const es = new EventSource('/api/events');
es.onmessage = (ev) => applyState(JSON.parse(ev.data));
loadConfig();
refreshHealth();
refreshUnfinished();
setInterval(refreshHealth, 10000);
</script>
</body>
</html>
