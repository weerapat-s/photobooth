<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บูทปริ้น</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: "Sarabun", "Segoe UI", sans-serif; background:#0f0f14; color:#eee; margin:0; padding:28px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .meta { color:#9a9aa8; font-size:14px; margin-bottom:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
  .card { background:#191921; border:1px solid #26262f; border-radius:14px; padding:20px; }
  h2 { font-size:15px; margin:0 0 12px; color:#b9b9c6; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #24242e; font-size:14px; }
  .row:last-child { border:none; }
  .row b { color:#9a9aa8; font-weight:500; }
  .ok { color:#5ad67d; } .bad { color:#ff5c72; } .warn { color:#ffd166; }
  .tag { background:#2a2a36; border-radius:999px; padding:2px 10px; font-size:12px; }
  .tag.me { background:#3a2540; color:#ffb3c8; }
  button { font:inherit; font-weight:600; padding:11px 22px; border:none; border-radius:10px; background:#ff4d6d; color:#fff; cursor:pointer; }
  button.ghost { background:#23232e; color:#e8e8ef; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  code { color:#ffd166; font-size:12px; word-break:break-all; }
</style>
</head>
<body>
<h1>บูทปริ้น <span id="printer-id"></span></h1>
<div class="meta" id="meta"></div>
<div class="btns" style="margin-bottom:18px"><a id="board-link" href="http://localhost:4702/queue.html" target="_blank"><button class="ghost">เปิดจอบอร์ดคิว</button></a></div>

<div class="grid">
  <div class="card">
    <h2>คิวงาน</h2>
    <div class="row"><b>รอพิมพ์</b><span id="pending">-</span></div>
    <div class="row"><b>เครื่องนี้กำลังทำ</b><span id="mine">-</span></div>
    <div class="row"><b>ดึงคิวล่าสุด</b><span id="lastpoll">-</span></div>
    <div class="row"><b>ข้อผิดพลาด</b><span id="err">-</span></div>
    <div class="btns">
      <button onclick="poll()">ดึงคิวเดี๋ยวนี้</button>
      <button class="ghost" onclick="requeue()">คืนงานค้างเข้าคิว</button>
    </div>
  </div>

  <div class="card">
    <h2>งานที่ถูกจองอยู่ (ทุกเครื่อง)</h2>
    <div id="claimed"></div>
  </div>

  <div class="card">
    <h2>ประวัติเครื่องนี้</h2>
    <div id="hist"></div>
  </div>

  <div class="card">
    <h2>งานที่ต้องให้ช่างตรวจ</h2>
    <div id="problems"></div>
  </div>
</div>

<script>
let myId = '';

async function refresh() {
  const s = await (await fetch('/api/status')).json();
  myId = s.printerId;
  document.getElementById('board-link').href = 'http://localhost:' + s.boardPort + '/queue.html';
  document.getElementById('printer-id').textContent = s.printerId;
  document.getElementById('meta').innerHTML =
    'เครื่องพิมพ์: <b>' + s.printer + '</b> · กระดาษ ' + s.paper + ' · auto ' + s.auto +
    (s.dryRun ? ' · <span class="warn">DRY RUN ไม่พิมพ์จริง</span>' : '') +
    (s.acceptBooths.length ? ' · รับเฉพาะ ' + s.acceptBooths.join(', ') : ' · รับทุกบูท') +
    '<br><code>' + s.queueDir + '</code>';
  const pendingNums = s.pending.map(function (n) {
    const m = n.match(/Q(\d+)__/);
    return m ? '#' + Number(m[1]) : null;
  }).filter(Boolean);
  document.getElementById('pending').textContent = pendingNums.length ? pendingNums.join(', ') : (s.pending.length ? s.pending.length + ' งาน' : 'ว่าง');
  document.getElementById('mine').textContent = s.mine.length ? s.mine.join(', ') : '-';
  document.getElementById('lastpoll').textContent = s.lastPoll ? new Date(s.lastPoll).toLocaleTimeString('th-TH') : '-';
  document.getElementById('err').innerHTML = s.lastError ? '<span class="bad">' + s.lastError + '</span>' : '<span class="ok">ปกติ</span>';
  document.getElementById('hist').innerHTML = s.history.map(function (h) {
    const q = h.queueNumber ? '#' + h.queueNumber + ' ' : '';
    return '<div class="row"><span>' + q + h.id + '</span><span class="' + (h.ok ? 'ok' : 'bad') + '">' +
      new Date(h.at).toLocaleTimeString('th-TH') + ' — ' + h.detail + '</span></div>';
  }).join('') || '<div class="row"><span>ยังไม่มี</span></div>';

  const claimed = await (await fetch('/api/claimed')).json();
  document.getElementById('claimed').innerHTML = claimed.map(function (c) {
    const mine = c.owner === myId ? ' me' : '';
    const q = c.queueNumber ? '#' + c.queueNumber + ' ' : '';
    return '<div class="row"><span class="tag' + mine + '">' + c.owner + '</span><span>' + q +
      (c.since ? new Date(c.since).toLocaleTimeString('th-TH') : '-') + '</span></div>';
  }).join('') || '<div class="row"><span>ไม่มีงานถูกจองอยู่</span></div>';

  const problems = await (await fetch('/api/problems')).json();
  document.getElementById('problems').innerHTML = problems.map(function (p) {
    const encoded = encodeURIComponent(p.name);
    const q = p.queueNumber ? '#' + p.queueNumber : p.name;
    const resolve = p.bucket === 'review'
      ? '<button class="ghost" onclick="resolveProblem(\'' + encoded + '\')">ยืนยันว่าพิมพ์แล้ว</button>'
      : '';
    return '<div class="row"><span><span class="warn">' + p.bucket + '</span> ' + q + '</span><span class="btns">' +
      '<button onclick="retryProblem(\'' + p.bucket + '\',\'' + encoded + '\')">ลองใหม่</button>' + resolve + '</span></div>';
  }).join('') || '<div class="row"><span class="ok">ไม่มีงานค้างตรวจ</span></div>';
}

async function poll() { await fetch('/api/poll', { method: 'POST' }); refresh(); }
async function requeue() {
  const r = await (await fetch('/api/requeue-stale', { method: 'POST' })).json();
  alert(r.ok ? 'คืนเข้าคิว ' + r.requeued + ' งาน' : r.error);
  refresh();
}
async function retryProblem(bucket, encodedName) {
  const r = await (await fetch('/api/retry/' + bucket + '/' + encodedName, { method: 'POST' })).json();
  if (!r.ok) alert(r.error || 'ย้ายงานกลับคิวไม่ได้');
  refresh();
}
async function resolveProblem(encodedName) {
  if (!confirm('ยืนยันว่ารูปใบนี้พิมพ์ออกแล้วจริง?')) return;
  const r = await (await fetch('/api/resolve/' + encodedName, { method: 'POST' })).json();
  if (!r.ok) alert(r.error || 'ยืนยันงานไม่ได้');
  refresh();
}
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
